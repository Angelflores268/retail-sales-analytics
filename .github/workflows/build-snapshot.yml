name: Build Retail Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install data build requirements
        run: python -m pip install 'pandas>=2.1,<3' 'openpyxl>=3.1,<4' 'requests>=2.31,<3'
      - name: Download, clean, and compress original UCI transactions
        run: python src/build_snapshot.py --output data/retail_sales.sqlite.gz
      - name: Commit database archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retail_sales.sqlite.gz
          git diff --cached --quiet || git commit -m "Add portable SQLite retail snapshot"
          git push

